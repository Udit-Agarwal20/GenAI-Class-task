                  - generic [ref=e281]: "\"Part 6: Bottom-Up Thinking Returning information upward instead of recomputing it The idea in one line Solve the left subtree, solve the right subtree, combine, and hand the result to your parent. That is all “bottom-up tree DP” means. It is the postorder position from Part 2 used deliberately . Once you can design what to return, you can solve diameter, balanced tree, maximum path sum, largest BST subtree, and most Medium tree problems with the same six lines. solve(node) L = solve(node.left) R = solve(node.right) combine L, R and node return the result upward Where the naive approach goes wrong Here is a concrete, honest example. Suppose we want, for every node, the height of the subtree rooted at that node. The direct approach: int height(TreeNode* root) { if (root == NULL) return 0; return 1 + max(height(root->left), height(root->right)); } void printAllHeights(TreeNode* root) { if (root == NULL) return; cout << root->val << \" has height \" << height(root) << \"\\n\"; // full walk\""
